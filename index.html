<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>PlaytonOS</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#edf5ff;background:#101827;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:#ffffff15;border-radius:9px;padding:10px}button:hover{background:#ffffff30}#desktop{height:100dvh;background:radial-gradient(ellipse at 80% 20%,#5589b8 0,transparent 44%),radial-gradient(ellipse at 20% 65%,#3848a9,transparent 60%),linear-gradient(130deg,#10162b,#183a53);padding:26px 20px 90px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}.shortcut{width:85px;text-align:center;background:none;display:grid;gap:5px;justify-items:center;font-size:12px}.shortcut i,.tile i{font-size:32px;font-style:normal}.brand{position:absolute;right:28px;top:26px;font-size:22px;letter-spacing:-1px;font-weight:800;opacity:.9}.brand small{display:block;font-size:10px;letter-spacing:2px;text-align:right;font-weight:400}.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#10192ad9;border:1px solid #ffffff35;border-radius:18px;padding:8px;backdrop-filter:blur(18px);z-index:9999;max-width:96vw}.dock button{font-size:20px;padding:9px;white-space:nowrap}.dock #clock{font-size:12px;padding:0 8px;white-space:nowrap}.win{position:fixed;top:12%;left:calc(50% - 310px);width:min(620px,94vw);height:min(490px,75dvh);background:#182235f5;border:1px solid #ffffff30;border-radius:15px;box-shadow:0 25px 80px #0008;display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:280px;min-height:200px}.bar{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#ffffff0a;touch-action:none;cursor:move;user-select:none}.bar .controls{display:flex;gap:4px}.bar button{padding:5px 10px}.body{padding:17px;overflow:auto;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}.tile{display:grid;gap:8px;text-align:left;padding:15px;background:#ffffff09;border:1px solid #ffffff17}.tile small{opacity:.7}.primary{background:#2778fa!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}input,textarea,select{background:#0e1728;color:inherit;border:1px solid #fff3;border-radius:8px;padding:10px;max-width:100%}textarea{width:100%;min-height:220px;resize:vertical}h2{margin-top:0}p{color:#aebed3;line-height:1.5}#menu{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(500px,94vw);max-height:70dvh;overflow:auto;background:#142034f5;border:1px solid #fff3;box-shadow:0 10px 50px #0008;border-radius:18px;padding:18px;z-index:10000}.hidden{display:none!important}iframe{width:100%;height:100%;border:0;background:white}.file{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff08;padding:8px;border-bottom:1px solid #fff2}.full{left:0!important;top:0!important;width:100%!important;height:calc(100dvh - 76px)!important;resize:none}#notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20000;background:#1d304b;padding:12px 20px;border-radius:12px;box-shadow:0 4px 20px #0008}@media(max-width:680px){.win{left:3vw!important;top:7%;height:75dvh;resize:none}.full{left:0!important}.brand{font-size:18px}.dock{gap:2px}.dock button{padding:8px;font-size:18px}}
</style></head><body><main id="desktop"><div class="brand">PlaytonOS<small>PLAYTON CORPORATION • ALPHA 0.1</small></div></main><section id="menu" class="hidden"><h2>PlaytonOS</h2><input id="search" placeholder="Поиск приложений" style="width:100%;margin-bottom:12px"><div id="apps" class="grid"></div></section><nav class="dock"><button id="start" title="Пуск">❖</button><button data-open="files">📁</button><button data-open="store">🛍️</button><button data-open="notes">📝</button><button data-open="settings">⚙️</button><span id="tasks"></span><span id="clock"></span></nav><div id="notice" class="hidden"></div><script src="os.js"></script></body></html>
